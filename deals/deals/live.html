<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live Deals</title>
<meta name="description" content="Live prices and real deals from talabat mart, Amazon.eg and Breadfast.">
<meta name="theme-color" content="#d6402b">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --ink: #1b1a17; --muted: #6d6a63; --faint: #a6a29a; --line: #e4e1da;
  --accent: #d6402b; --accent-ink: #ffffff; --good: #1f7a4d; --good-bg: #e3f3ea; --warn: #9a6a00; --warn-bg: #fbf0d4;
  --chip: #efede8; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.04); --drop: #1f7a4d;
  --talabat: #ff5a00; --amazon_eg: #232f3e; --breadfast: #a80080; --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121211; --panel: #1c1b19; --ink: #f0eee9; --muted: #a29e95; --faint: #6f6b64; --line: #2f2d29;
    --accent: #ff6b55; --accent-ink: #1b0b07; --good: #5cc98f; --good-bg: #173326; --warn: #e6b84d; --warn-bg: #3a2f12;
    --chip: #262421; --shadow: none; --drop: #5cc98f; --amazon_eg: #8aa0bb;
  }
}
:root[data-theme="dark"] {
  --bg: #121211; --panel: #1c1b19; --ink: #f0eee9; --muted: #a29e95; --faint: #6f6b64; --line: #2f2d29;
  --accent: #ff6b55; --accent-ink: #1b0b07; --good: #5cc98f; --good-bg: #173326; --warn: #e6b84d; --warn-bg: #3a2f12;
  --chip: #262421; --shadow: none; --drop: #5cc98f; --amazon_eg: #8aa0bb;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.4 system-ui, -apple-system, "Segoe UI", "Noto Sans Arabic", Tahoma, sans-serif; }
button, input, select { font: inherit; color: inherit; }
a { color: inherit; }
.wrap { max-width: 1400px; margin: 0 auto; padding: 0 16px; }

/* header */
header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top { display: flex; align-items: center; gap: 12px; padding: 12px 0 8px; }
h1 { font-size: 19px; margin: 0; letter-spacing: -.01em; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
.pulse { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); animation: pulse 2s infinite; flex: none; }
@keyframes pulse { 50% { opacity: .25; } }
.search { flex: 1; min-width: 0; position: relative; }
.search input { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 9px 12px 9px 34px; font-size: 15px; }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--faint); }
.iconbtn { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; height: 40px; min-width: 40px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 10px; cursor: pointer; flex: none; }
.iconbtn .n { background: var(--accent); color: var(--accent-ink); border-radius: 999px; font-size: 11px; padding: 0 6px; font-weight: 700; }
.status { color: var(--muted); font-size: 12.5px; padding: 0 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ticker { overflow: hidden; border-top: 1px solid var(--line); height: 30px; position: relative; font-size: 13px; }
.ticker-track { display: inline-flex; gap: 28px; white-space: nowrap; padding-left: 100%; line-height: 30px;
  animation: scroll linear infinite; }
.ticker:hover .ticker-track { animation-play-state: paused; }
@keyframes scroll { to { transform: translateX(-100%); } }
.tick { cursor: pointer; color: var(--muted); }
.tick b { color: var(--ink); font-weight: 600; }
.tick .down { color: var(--drop); font-weight: 600; } .tick .up { color: var(--accent); font-weight: 600; }

/* layout */
.layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 20px; padding-top: 16px; padding-bottom: 60px; }
aside { position: sticky; top: 130px; align-self: start; max-height: calc(100vh - 140px); overflow: auto; padding-right: 4px; }
.fgroup { padding: 12px 0; border-bottom: 1px solid var(--line); }
.fgroup:first-child { padding-top: 0; }
.fgroup h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; font-weight: 650; }
.seg { display: flex; background: var(--chip); border-radius: 9px; padding: 3px; gap: 2px; }
.seg button { flex: 1; border: 0; background: none; padding: 6px 4px; border-radius: 7px; cursor: pointer; font-size: 13px; color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); font-weight: 600; }
.opts { display: flex; flex-direction: column; gap: 2px; }
.opt { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 7px; cursor: pointer; font-size: 14px; }
.opt:hover { background: var(--chip); }
.opt input { accent-color: var(--accent); margin: 0; width: 16px; height: 16px; }
.opt .c { margin-left: auto; color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
.opt .dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.range { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.range label { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.range input[type=number], select.full { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
.slider { position: relative; height: 30px; margin: 2px 4px 0; }
.slider input { position: absolute; inset: 0; width: 100%; pointer-events: none; -webkit-appearance: none; appearance: none; background: none; margin: 0; }
.slider input::-webkit-slider-thumb { pointer-events: auto; -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--panel); border: 2px solid var(--accent); cursor: pointer; }
.slider input::-moz-range-thumb { pointer-events: auto; width: 14px; height: 14px; border-radius: 50%; background: var(--panel); border: 2px solid var(--accent); cursor: pointer; }
.slider .rail { position: absolute; left: 0; right: 0; top: 14px; height: 3px; background: var(--line); border-radius: 2px; }
.slider .fill { position: absolute; top: 14px; height: 3px; background: var(--accent); border-radius: 2px; }
.pctlabel { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; text-transform: none; letter-spacing: 0; color: var(--ink); }
.reset { width: 100%; margin-top: 12px; background: none; border: 1px dashed var(--line); border-radius: 9px; padding: 8px; cursor: pointer; color: var(--muted); }

.bar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.count { font-weight: 650; font-size: 15px; }
.count small { color: var(--muted); font-weight: 400; }
.bar .spacer { flex: 1; }
.bar select { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 7px 10px; max-width: 100%; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 10px; font-size: 12.5px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.chip:hover { border-color: var(--muted); }
.chip .x { color: var(--faint); }
.filterbtn { display: none; }

/* cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; display: flex;
  flex-direction: column; box-shadow: var(--shadow); cursor: pointer; transition: transform .12s, border-color .12s; position: relative; min-width: 0; }
.card:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--muted) 40%, var(--line)); }
.card.fresh { animation: fresh 2.5s ease-out; }
@keyframes fresh { from { box-shadow: 0 0 0 3px var(--accent); } }
.card.out { opacity: .62; }
.pic { position: relative; aspect-ratio: 1 / .86; background: #fff; display: grid; place-items: center; }
.pic img { max-width: 82%; max-height: 82%; object-fit: contain; }
.pic .ph { font-size: 34px; font-weight: 700; color: #d9d5cc; }
.badge { position: absolute; top: 8px; left: 8px; color: #fff; font-weight: 750; font-size: 13px; padding: 3px 8px; border-radius: 7px; background: #d6402b; letter-spacing: .01em; }
.badge.drop { background: #1f7a4d; }
.score { position: absolute; top: 6px; right: 6px; width: 38px; height: 38px; }
.score text { font-size: 12px; font-weight: 750; fill: #1b1a17; }
.why .score { position: static; flex: none; width: 52px; height: 52px; }
.store { position: absolute; bottom: 8px; left: 8px; color: #fff; font-size: 11px; font-weight: 650; padding: 2px 7px; border-radius: 5px; }
.watch { position: absolute; bottom: 6px; right: 6px; width: 32px; height: 32px; border-radius: 50%; border: 0; background: rgba(255,255,255,.92);
  display: grid; place-items: center; cursor: pointer; color: #a6a29a; box-shadow: 0 1px 3px rgba(0,0,0,.15); font-size: 16px; }
.watch[aria-pressed="true"] { color: #e0a100; }
.body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; }
.name { font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.8em; }
.priceline { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; margin-top: auto; }
.now { font-size: 19px; font-weight: 750; letter-spacing: -.01em; white-space: nowrap; }
.now small { font-size: 12px; font-weight: 600; color: var(--muted); }
.was { color: var(--muted); text-decoration: line-through; font-size: 13px; margin-left: 4px; }
.spark { width: 72px; height: 26px; flex: none; }
.meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
.tags { display: flex; gap: 4px; flex-wrap: wrap; }
.tag { font-size: 11px; padding: 2px 6px; border-radius: 5px; background: var(--chip); color: var(--muted); white-space: nowrap; }
.tag.good { background: var(--good-bg); color: var(--good); font-weight: 600; }
.tag.warn { background: var(--warn-bg); color: var(--warn); }
.tag.hot { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); font-weight: 600; }
.cta { margin-top: 4px; display: flex; gap: 6px; }
.cta a { flex: 1; text-align: center; text-decoration: none; background: var(--ink); color: var(--bg); border-radius: 9px; padding: 7px 8px; font-size: 13px; font-weight: 600; }
.empty { text-align: center; color: var(--muted); padding: 60px 16px; grid-column: 1 / -1; }
.skel { background: linear-gradient(90deg, var(--chip), var(--panel), var(--chip)); background-size: 200% 100%; animation: sk 1.2s infinite; border-radius: var(--radius); height: 330px; }
@keyframes sk { to { background-position: -200% 0; } }
#more { height: 1px; }

/* dialog */
dialog { border: 1px solid var(--line); border-radius: 18px; background: var(--panel); color: var(--ink);
  width: min(720px, calc(100vw - 24px)); max-height: calc(100vh - 32px); padding: 0; }
dialog::backdrop { background: rgba(0,0,0,.5); backdrop-filter: blur(2px); }
.dlg { padding: 20px; }
.dlg-head { display: grid; grid-template-columns: 110px 1fr; gap: 16px; align-items: start; }
.dlg-head .img { width: 110px; height: 110px; background: #fff; border-radius: 12px; display: grid; place-items: center; border: 1px solid var(--line); }
.dlg-head img { max-width: 90%; max-height: 90%; }
.dlg h2 { font-size: 17px; margin: 0 30px 6px 0; line-height: 1.3; }
.x { position: absolute; top: 12px; right: 14px; background: var(--chip); border: 0; border-radius: 50%; width: 32px; height: 32px; cursor: pointer; font-size: 18px; color: var(--muted); }
.bigprice { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
.why { margin: 14px 0; padding: 12px 14px; background: var(--chip); border-radius: 12px; display: flex; gap: 14px; align-items: center; }
.why ul { margin: 0; padding-left: 18px; font-size: 14px; }
.chart { width: 100%; height: 200px; display: block; touch-action: pan-y; }
.chart .ln { fill: none; stroke: var(--accent); stroke-width: 2.2; vector-effect: non-scaling-stroke; }
.chart .ar { fill: color-mix(in srgb, var(--accent) 12%, transparent); }
.chart .ax { stroke: var(--line); }
.chart text { fill: var(--muted); font-size: 11px; }
.chart .hover line { stroke: var(--muted); stroke-dasharray: 3 3; }
.chart .hover circle { fill: var(--accent); }
.tip { font-size: 13px; color: var(--muted); min-height: 18px; }
table.cmp { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 6px; }
table.cmp td { padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: middle; }
table.cmp td:last-child { text-align: right; }
table.cmp .best { color: var(--good); font-weight: 700; }
.row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 9px 14px; cursor: pointer; text-decoration: none; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 650; }
.alert { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 12px; font-size: 14px; }
.alert input { width: 110px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; }
h4 { margin: 18px 0 4px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }

.toasts { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 20; display: flex; flex-direction: column; gap: 8px; width: min(420px, calc(100vw - 32px)); }
.toast { background: var(--ink); color: var(--bg); padding: 11px 14px; border-radius: 12px; font-size: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.25); cursor: pointer; animation: up .25s ease-out; }
@keyframes up { from { transform: translateY(10px); opacity: 0; } }

@media (max-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  aside { position: fixed; inset: auto 0 0 0; top: auto; max-height: 82vh; background: var(--panel); z-index: 15; border-radius: 18px 18px 0 0;
    padding: 6px 16px 24px; transform: translateY(105%); transition: transform .25s ease; box-shadow: 0 -10px 40px rgba(0,0,0,.25); }
  aside.open { transform: none; }
  aside::before { content: ""; display: block; width: 40px; height: 4px; background: var(--line); border-radius: 2px; margin: 4px auto 10px; }
  .sheet-done { display: flex !important; width: 100%; justify-content: center; margin-top: 14px; }
  .filterbtn { display: inline-flex; }
  h1 .t { display: none; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 10px; }
  .now { font-size: 17px; } .spark { width: 52px; }
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 14; }
  .dlg-head { grid-template-columns: 80px 1fr; } .dlg-head .img { width: 80px; height: 80px; }
  .dlg { padding: 16px; }
}
.sheet-done { display: none; }
@media (prefers-reduced-motion: reduce) { .pulse, .card.fresh, .ticker-track, .skel { animation: none; } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1><span class="pulse"></span><span class="t">Live deals</span></h1>
      <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="q" placeholder="Search milk, Pepsi, حفاضات…" aria-label="Search" autocomplete="off"></label>
      <button class="iconbtn" id="watchBtn" title="Watchlist" aria-label="Watchlist">★ <span class="n" id="watchN" hidden>0</span></button>
      <button class="iconbtn filterbtn" id="filterBtn" aria-label="Filters">Filters <span class="n" id="filterN" hidden>0</span></button>
    </div>
    <div class="status" id="status">connecting…</div>
  </div>
  <div class="ticker" id="ticker" hidden><div class="ticker-track" id="tickerTrack"></div></div>
</header>

<div class="wrap layout">
  <aside id="filters" aria-label="Filters">
    <div class="fgroup"><h3>Show</h3>
      <div class="seg" data-key="deals"><button data-v="1">Deals</button><button data-v="0">All products</button></div></div>
    <div class="fgroup"><h3>Platform</h3><div class="opts" id="fStores"></div></div>
    <div class="fgroup"><h3>Discount type</h3>
      <div class="seg" data-key="kind"><button data-v="">Any</button><button data-v="platform">Platform</button><button data-v="drop">Price drop</button></div>
      <div class="meta" style="margin-top:6px" id="kindCounts"></div></div>
    <div class="fgroup"><h3>Discount <span class="pctlabel" id="pctLabel"></span></h3>
      <div class="slider"><div class="rail"></div><div class="fill" id="pctFill"></div>
        <input type="range" id="pmin" min="0" max="90" step="5" aria-label="Minimum discount">
        <input type="range" id="pmax" min="0" max="90" step="5" aria-label="Maximum discount"></div></div>
    <div class="fgroup"><h3>Availability</h3>
      <div class="seg" data-key="stock"><button data-v="in">In stock</button><button data-v="out">Out</button><button data-v="all">All</button></div></div>
    <div class="fgroup"><h3>Status</h3><div class="opts" id="fStatus">
      <label class="opt" title="Hides discounts whose price never moves"><input type="checkbox" value="real"> Real deals only</label>
      <label class="opt"><input type="checkbox" value="new"> Changed in the last 24 h</label>
      <label class="opt"><input type="checkbox" value="lowest"> Lowest price in 90 days</label>
      <label class="opt"><input type="checkbox" value="label"> Store event deals</label>
      <label class="opt"><input type="checkbox" value="back"> Back in stock</label>
      <label class="opt"><input type="checkbox" value="compare"> Sold in other stores too</label>
      <label class="opt"><input type="checkbox" id="fBest"> Cheapest across stores</label>
      <label class="opt"><input type="checkbox" id="fWatch"> My watchlist</label>
    </div></div>
    <div class="fgroup"><h3>Category</h3><select class="full" id="fCat" aria-label="Category"></select></div>
    <div class="fgroup"><h3>Price (EGP)</h3>
      <div class="range"><label>From<input type="number" id="prmin" min="0" inputmode="decimal" placeholder="0"></label>
        <label>To<input type="number" id="prmax" min="0" inputmode="decimal" placeholder="any"></label></div></div>
    <button class="reset" id="reset">Reset filters</button>
    <button class="btn primary sheet-done" id="sheetDone">Show results</button>
  </aside>

  <main>
    <div class="bar">
      <span class="count" id="count">…</span>
      <div class="chips" id="activeChips"></div>
      <span class="spacer"></span>
      <select id="sort" aria-label="Sort by">
        <option value="score">Best deals first</option>
        <option value="discount">Biggest discount %</option>
        <option value="saving">Biggest saving (EGP)</option>
        <option value="newest">Just changed</option>
        <option value="drop">Biggest drop vs usual</option>
        <option value="price">Price: low to high</option>
        <option value="price_desc">Price: high to low</option>
        <option value="unit">Price per kg / L / piece</option>
        <option value="popular">Best sellers</option>
        <option value="name">Name</option>
      </select>
    </div>
    <div class="grid" id="grid"></div>
    <div id="more"></div>
  </main>
</div>

<dialog id="dlg" aria-labelledby="dname"><div class="dlg" id="dbody"></div></dialog>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => n == null ? "" : Number(n).toLocaleString("en-EG", { maximumFractionDigits: 2 });
const ago = t => { if (!t) return "—"; const s = Math.max(0, Date.now() / 1000 - t);
  return s < 60 ? Math.round(s) + " s ago" : s < 3600 ? Math.round(s / 60) + " min ago" : s < 86400 ? Math.round(s / 3600) + " h ago" : Math.round(s / 86400) + " d ago"; };
const mins = s => s < 90 ? Math.round(s) + " s" : Math.round(s / 60) + " min";
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
                set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const isAndroid = /Android/i.test(navigator.userAgent), isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
const appHref = d => (isAndroid ? d.links?.android : isIOS ? d.links?.ios : d.links?.web) || d.links?.web || d.url || "#";
const appLabel = { talabat: "talabat", amazon_eg: "Amazon", breadfast: "Breadfast" };
const LABELS = { talabat: "talabat mart", amazon_eg: "Amazon.eg", breadfast: "Breadfast" };

// ---------- state, mirrored in the address so any view can be shared ----------
const DEFAULTS = { deals: "1", stores: [], kind: "", min: 0, max: 90, stock: "in", status: [], best: false, watch: false,
                   category: "", q: "", pmin: "", pmax: "", sort: "score" };
let F = { ...DEFAULTS };
function readURL() {
  const p = new URLSearchParams(location.search);
  F = { ...DEFAULTS, stores: [], status: [] };
  for (const k of ["deals", "kind", "stock", "category", "q", "pmin", "pmax", "sort"]) if (p.has(k)) F[k] = p.get(k);
  for (const k of ["min", "max"]) if (p.has(k)) F[k] = +p.get(k);
  for (const k of ["stores", "status"]) if (p.get(k)) F[k] = p.get(k).split(",");
  F.best = p.get("best") === "1"; F.watch = p.get("watch") === "1";
}
function writeURL() {
  const p = new URLSearchParams();
  for (const [k, v] of Object.entries(F)) {
    if (Array.isArray(v) ? v.length : v !== DEFAULTS[k] && v !== "" && v !== false)
      p.set(k, Array.isArray(v) ? v.join(",") : v === true ? "1" : v);

// ---------- watchlist and price alerts (kept in this browser) ----------
let watch = store.get("watch", {});  // id -> {target, last, name, store}
function saveWatch() { store.set("watch", watch); const n = Object.keys(watch).length; $("watchN").hidden = !n; $("watchN").textContent = n; }

function toggleWatch(d, btn) {
  if (watch[d.id]) { delete watch[d.id]; toast("Removed from your watchlist."); }
  else { watch[d.id] = { target: null, last: d.price, name: d.name, store: d.store };
         toast(`Watching it. You'll hear when the price drops.`); askNotify(); }
  saveWatch();
  if (btn) btn.setAttribute("aria-pressed", String(!!watch[d.id]));
}
async function checkWatch() {
  const ids = Object.keys(watch);
  if (!ids.length) return;
  try {
    const r = await (await fetch(`/api/deals?deals=0&stock=all&limit=500&ids=${ids.join(",")}`)).json();
    for (const d of r.items) {
      const w = watch[d.id]; if (!w) continue;
      const hitTarget = w.target && d.price <= w.target && (w.last == null || w.last > w.target);
      const dropped = w.last != null && d.price < w.last;
      if (hitTarget || dropped) notify(`${hitTarget ? "Target reached" : "Price drop"}: ${d.name}`,
        `${fmt(w.last)} → ${fmt(d.price)} EGP at ${LABELS[d.store] || d.store}`, d.id);
      w.last = d.price;
    }

  } catch {}
}
function notify(title, body, id) {
  toast(`<b>${esc(title)}</b><br>${esc(body)}`, () => showProduct(id), true);
  if ("Notification" in window && Notification.permission === "granted" && document.hidden) {
    const n = new Notification(title, { body, icon: "/icon.svg", tag: "deal-" + id });
    n.onclick = () => { window.focus(); showProduct(id); };

}
function toast(html, onclick, raw) {

  t.onclick = () => { if (onclick) onclick(); t.remove(); };
  $("toasts").append(t); setTimeout(() => t.remove(), 6000);
}

// ---------- cards ----------
function sparkSVG(pts, w = 72, h = 26) {
  if (!pts || pts.length < 2) return "";
  const t0 = pts[0][0], t1 = pts[pts.length - 1][0], ps = pts.map(p => p[1]);
  const lo = Math.min(...ps), hi = Math.max(...ps), span = hi - lo || 1;
  const X = t => 2 + (w - 4) * (t - t0) / ((t1 - t0) || 1), Y = v => hi === lo ? h / 2 : 3 + (h - 6) * (1 - (v - lo) / span);
  let d = `M${X(pts[0][0]).toFixed(1)} ${Y(pts[0][1]).toFixed(1)}`;
  for (let i = 1; i < pts.length; i++) d += ` H${X(pts[i][0]).toFixed(1)} V${Y(pts[i][1]).toFixed(1)}`;
  const first = ps[0], last = ps[ps.length - 1];
  const col = last < first ? "var(--drop)" : last > first ? "var(--accent)" : "var(--faint)";
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d}" fill="none" stroke="${col}" stroke-width="1.8"/>
    <circle cx="${X(t1).toFixed(1)}" cy="${Y(last).toFixed(1)}" r="2.4" fill="${col}"/></svg>`;
}
function scoreSVG(s) {
  const r = 15, c = 2 * Math.PI * r, col = s >= 70 ? "#1f9d5c" : s >= 40 ? "#e0a100" : "#b9b4aa";
  return `<svg class="score" viewBox="0 0 38 38" role="img" aria-label="Deal score ${s} of 100"><title>Deal score ${s}/100</title>
    <circle cx="19" cy="19" r="17.5" fill="rgba(255,255,255,.96)"/>
    <circle cx="19" cy="19" r="${r}" fill="none" stroke="#ece9e2" stroke-width="3"/>
    <circle cx="19" cy="19" r="${r}" fill="none" stroke="${col}" stroke-width="3" stroke-linecap="round" stroke-dasharray="${(c * s / 100).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 19 19)"/>
    <text x="19" y="23.5" text-anchor="middle">${s}</text></svg>`;
}
function tagsFor(d) {
  const t = [];
  if (d.deal_label) t.push(`<span class="tag hot">${esc(d.deal_label)}</span>`);
  if (d.flags.includes("lowest")) t.push('<span class="tag good">lowest in 90 days</span>');
  if (d.flags.includes("new")) t.push(`<span class="tag">changed ${ago(d.since)}</span>`);
  if (d.flags.includes("back")) t.push('<span class="tag good">back in stock</span>');
  if (d.cheapest && d.matches.length) t.push('<span class="tag good">cheapest of all stores</span>');
  else if (d.matches.length) { const m = d.matches.find(x => x.in_stock && x.price < d.price);
    if (m) t.push(`<span class="tag warn">${fmt(m.price)} at ${esc(LABELS[m.store] || m.store)}</span>`); }
  if (d.flags.includes("steady")) t.push('<span class="tag warn">discount never moves</span>');
  if (!d.in_stock) t.push('<span class="tag">out of stock</span>');
  return t.join("");
}
const initial = n => esc((n || "?").trim()[0] || "?");
function card(d, fresh) {
  const badge = d.discount_pct > 0 ? `<span class="badge ${d.kind === "drop" ? "drop" : ""}" title="${d.kind === "drop" ? "under its usual price" : "the store's own discount"}">−${Math.round(d.discount_pct)}%</span>` : "";
  const unit = d.unit_price ? `${fmt(d.unit_price)} / ${d.unit === "pc" ? "piece" : d.unit}` : "";

// ---------- loading ----------
let items = [], total = 0, seen = new Set(), firstLoad = true, loading = false, timer, sig = "", lastStatus = [], lastChanges = 0;
const PAGE = 48;
function params(offset, limit) {
  const p = new URLSearchParams({ deals: F.deals, stock: F.stock, sort: F.sort, limit, offset });
  if (F.stores.length) p.set("stores", F.stores.join(","));
  if (F.kind) p.set("kind", F.kind);
  if (F.min) p.set("min", F.min);
  if (F.max < 90) p.set("max", F.max);
  if (F.status.length) p.set("status", F.status.join(","));
  if (F.best) p.set("best", "1");
  if (F.category) p.set("category", F.category);
  if (F.q.trim()) p.set("q", F.q.trim());
  if (F.pmin !== "") p.set("pmin", F.pmin);
  if (F.pmax !== "") p.set("pmax", F.pmax);
  if (F.watch) { p.set("ids", Object.keys(watch).join(",") || "0"); p.set("deals", "0"); p.set("stock", "all"); }
  return p;
}
async function load({ append = false, quiet = false } = {}) {
  if (loading) return; loading = true;
  const offset = append ? items.length : 0, limit = append ? PAGE : Math.max(PAGE, quiet ? items.length : PAGE);
  if (!quiet && !append) $("grid").innerHTML = Array.from({ length: 8 }, () => '<div class="skel"></div>').join("");
  try {
    const r = await (await fetch("/api/deals?" + params(offset, limit))).json();
    lastStatus = r.status || []; lastChanges = r.changes_last_hour || 0; renderStatus();
    renderFacets(r); total = r.total;
    $("count").innerHTML = `${total.toLocaleString()} <small>${F.deals === "1" && !F.watch ? (total === 1 ? "deal" : "deals") : "products"}</small>`;
    if (append) {
      items = items.concat(r.items);
      $("grid").insertAdjacentHTML("beforeend", r.items.map(d => card(d, false)).join(""));
    } else {
      const s = JSON.stringify(r.items.map(d => [d.id, d.price, d.score, d.in_stock, d.flags]));
      if (s !== sig || !quiet) {  // a quiet refresh only redraws when something changed
        sig = s; items = r.items;
        $("grid").innerHTML = items.length ? items.map(d => card(d, !firstLoad && quiet && !seen.has(d.id))).join("")
          : `<div class="empty">${F.watch ? "Your watchlist is empty: tap ★ on any product to follow its price." :
             "Nothing matches these filters yet. The first sweep of each store takes about 15 minutes, and price-drop deals need a few days of history."}</div>`;
      }
    }
    r.items.forEach(d => seen.add(d.id));
    firstLoad = false;
  } catch (e) { $("status").textContent = "can't reach the server, retrying…"; }
  loading = false;
  clearTimeout(timer); timer = setTimeout(() => load({ quiet: true }), document.hidden ? 60000 : 10000);
}
function apply() { writeURL(); activeChips(); load(); }

function renderStatus() {
  const parts = lastStatus.map(s => {
    let t = `<b>${esc(s.label)}</b> ${s.products.toLocaleString()}`;
    if (s.paused_until) return t + ` · paused, back in ${mins(s.paused_until - Date.now() / 1000)}`;
    if (s.live) t += s.last_change ? ` · changed ${ago(s.last_change)}` : " · watching";
    t += s.cycle_secs ? ` · full sweep ${mins(s.cycle_secs)}` : s.live ? " · first sweep" : ` · ${ago(s.updated)}`;
    return t;
  });
  $("status").innerHTML = parts.length ? parts.join(" &nbsp;·&nbsp; ") + ` &nbsp;·&nbsp; ${lastChanges.toLocaleString()} price changes in the last hour`
    : "starting: the first prices arrive within a minute";
}
setInterval(renderStatus, 1000);

function drawChart(h, current) {
  const now = Date.now() / 1000;
  const pts = h.filter(r => r.in_stock).map(r => [r.at, r.price]);
  if (!pts.length) pts.push([now - 60, current]);
  pts.push([now, pts[pts.length - 1][1]]);
  const W = 640, H = 200, L = 46, R = 8, T = 10, B = 24;
  const t0 = pts[0][0], t1 = Math.max(now, t0 + 1), ps = pts.map(p => p[1]);
  const lo = Math.min(...ps), hi = Math.max(...ps), pad = (hi - lo) * .15 || hi * .05 || 1;
  const X = t => L + (W - L - R) * (t - t0) / (t1 - t0), Y = v => T + (H - T - B) * (1 - (v - (lo - pad)) / ((hi + pad) - (lo - pad)));
  let d = `M${X(pts[0][0]).toFixed(1)} ${Y(pts[0][1]).toFixed(1)}`;
  for (let i = 1; i < pts.length; i++) d += ` H${X(pts[i][0]).toFixed(1)} V${Y(pts[i][1]).toFixed(1)}`;
  const area = d + ` V${H - B} H${X(pts[0][0]).toFixed(1)} Z`;
  const date = t => new Date(t * 1000).toLocaleDateString(undefined, { day: "numeric", month: "short" });
  const svg = $("chart");
  svg.innerHTML = `<path class="ar" d="${area}"/><path class="ln" d="${d}"/>
    <line class="ax" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"/>
    <text x="4" y="${Y(hi) + 4}">${fmt(hi)}</text>${hi !== lo ? `<text x="4" y="${Y(lo) + 4}">${fmt(lo)}</text>` : ""}
    <text x="${L}" y="${H - 6}">${date(t0)}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">now</text>
    <g class="hover" visibility="hidden"><line y1="${T}" y2="${H - B}"/><circle r="4"/></g>`;
  const g = svg.querySelector(".hover");
  const move = e => {
    const rect = svg.getBoundingClientRect(), x = Math.max(L, Math.min(W - R, (e.clientX - rect.left) / rect.width * W));
    const t = t0 + (x - L) / (W - L - R) * (t1 - t0);
    let i = 0; while (i + 1 < pts.length && pts[i + 1][0] <= t) i++;
    const v = pts[i][1];
    g.setAttribute("visibility", "visible");
    g.querySelector("line").setAttribute("x1", x); g.querySelector("line").setAttribute("x2", x);
    g.querySelector("circle").setAttribute("cx", x); g.querySelector("circle").setAttribute("cy", Y(v));
    $("tip").textContent = `${fmt(v)} EGP on ${new Date(Math.min(t, now) * 1000).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" })}`;
  };
  svg.onpointermove = move; svg.onpointerdown = move;
}

// ---------- wiring ----------
document.querySelectorAll(".seg").forEach(seg => seg.querySelectorAll("button").forEach(b => b.onclick = () => {
  F[seg.dataset.key] = b.dataset.v; syncControls(); apply(); }));
let slideT;
["pmin", "pmax"].forEach(id => $(id).oninput = () => {
  let a = +$("pmin").value, b = +$("pmax").value;
  if (a > b) { if (id === "pmin") $("pmax").value = b = a; else $("pmin").value = a = b; }
  paintSlider(); clearTimeout(slideT); slideT = setTimeout(() => { F.min = a; F.max = b; apply(); }, 250); });
$("fStatus").querySelectorAll("input[value]").forEach(i => i.onchange = () => {
  F.status = [...$("fStatus").querySelectorAll("input[value]:checked")].map(x => x.value); apply(); });
$("fBest").onchange = () => { F.best = $("fBest").checked; apply(); };
$("fWatch").onchange = () => { F.watch = $("fWatch").checked; apply(); };
$("fCat").onchange = () => { F.category = $("fCat").value; apply(); };
let priceT;
["prmin", "prmax"].forEach(id => $(id).oninput = () => { clearTimeout(priceT); priceT = setTimeout(() => {
  F.pmin = $("prmin").value; F.pmax = $("prmax").value; apply(); }, 400); });
$("sort").onchange = () => { F.sort = $("sort").value; apply(); };
let typing;
$("q").oninput = () => { clearTimeout(typing); typing = setTimeout(() => { F.q = $("q").value; apply(); }, 300); };
$("reset").onclick = () => { F = { ...DEFAULTS, stores: [], status: [] }; syncControls(); apply(); };
$("watchBtn").onclick = () => { F.watch = !F.watch; syncControls(); apply(); };
const sheet = open => { $("filters").classList.toggle("open", open);
  document.querySelector(".scrim")?.remove();
  if (open) { const s = document.createElement("div"); s.className = "scrim"; s.onclick = () => sheet(false); document.body.append(s); } };
$("filterBtn").onclick = () => sheet(true);
$("sheetDone").onclick = () => sheet(false);
$("grid").addEventListener("click", e => {
  const c = e.target.closest(".card"); if (!c) return;
  const d = items.find(x => x.id === +c.dataset.id); if (!d) return;
  if (e.target.closest("[data-watch]")) { e.stopPropagation(); toggleWatch(d, e.target.closest("[data-watch]")); return; }
  if (e.target.closest("[data-open]")) return;  // the link opens the store's app at this product
  showProduct(d.id);
});
new IntersectionObserver(es => { if (es[0].isIntersecting && items.length && items.length < total && !loading) load({ append: true }); },
  { rootMargin: "800px" }).observe($("more"));
document.addEventListener("keydown", e => {
  if (e.key === "/" && !["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement.tagName)) { e.preventDefault(); $("q").focus(); }
  if (e.key === "Escape" && $("filters").classList.contains("open")) sheet(false);
});
document.addEventListener("visibilitychange", () => { if (!document.hidden) { load({ quiet: true }); loadTicker(); } });

readURL(); syncControls(); saveWatch(); activeChips(); load(); loadTicker();
setInterval(loadTicker, 15000); setInterval(checkWatch, 60000); checkWatch();
const pid = new URLSearchParams(location.search).get("p"); if (pid) showProduct(+pid);
</script>
</body>
</html>
