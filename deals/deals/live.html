<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Deals</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --ink: #1b1a17; --muted: #6d6a63; --line: #e4e1da;
  --accent: #d6402b; --accent-ink: #ffffff; --good: #1f7a4d; --chip: #efede8; --shadow: 0 1px 2px rgba(0,0,0,.06);
  --talabat: #ff5a00; --amazon_eg: #232f3e; --breadfast: #a80080;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131312; --panel: #1d1c1a; --ink: #f0eee9; --muted: #a29e95; --line: #302e2a;
    --accent: #ff6b55; --accent-ink: #1b0b07; --good: #5cc98f; --chip: #272522; --shadow: none;
    --amazon_eg: #8aa0bb;
  }
}
:root[data-theme="dark"] {
  --bg: #131312; --panel: #1d1c1a; --ink: #f0eee9; --muted: #a29e95; --line: #302e2a;
  --accent: #ff6b55; --accent-ink: #1b0b07; --good: #5cc98f; --chip: #272522; --shadow: none;
  --amazon_eg: #8aa0bb;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.4 system-ui, -apple-system, "Segoe UI", "Noto Sans Arabic", Tahoma, sans-serif; }
header { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px; }
.top { display: flex; align-items: baseline; gap: 12px; padding: 14px 0 8px; flex-wrap: wrap; }
h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
.pulse { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
  margin-right: 6px; vertical-align: 2px; animation: pulse 2s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .pulse, .card.fresh { animation: none; } }
.status { color: var(--muted); font-size: 13px; }
.controls { display: flex; gap: 8px; padding: 0 0 12px; flex-wrap: wrap; align-items: center; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 999px;
  padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
input, select { font: inherit; font-size: 14px; color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
input[type=search] { flex: 1 1 200px; min-width: 0; }
main { padding: 16px 0 40px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
  display: flex; flex-direction: column; box-shadow: var(--shadow); cursor: pointer; transition: transform .12s; }
.card:hover { transform: translateY(-2px); }
.card.fresh { animation: fresh 3s; }
@keyframes fresh { from { box-shadow: 0 0 0 3px var(--accent); } }
.pic { position: relative; aspect-ratio: 1; background: #fff; display: grid; place-items: center; }
.pic img { max-width: 86%; max-height: 86%; object-fit: contain; }
.badge { position: absolute; top: 8px; left: 8px; background: var(--accent); color: var(--accent-ink);
  font-weight: 700; font-size: 13px; padding: 3px 8px; border-radius: 6px; }
.store { position: absolute; bottom: 8px; left: 8px; color: #fff; font-size: 11px; font-weight: 600;
  padding: 2px 7px; border-radius: 4px; }
.body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.name { font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.prices { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-top: auto; }
.now { font-size: 18px; font-weight: 700; }
.was { color: var(--muted); text-decoration: line-through; font-size: 13px; }
.note { font-size: 12px; color: var(--muted); }
.tags { display: flex; gap: 4px; flex-wrap: wrap; }
.tag { font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--chip); color: var(--muted); }
.tag.lowest { color: var(--good); }
.tag.steady { color: var(--muted); font-style: italic; }
.empty { text-align: center; color: var(--muted); padding: 60px 16px; }
dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--ink);
  width: min(560px, calc(100vw - 32px)); padding: 18px; }
dialog::backdrop { background: rgba(0,0,0,.45); }
dialog h2 { font-size: 16px; margin: 0 28px 4px 0; }
dialog .x { position: absolute; top: 10px; right: 12px; background: none; border: 0; color: var(--muted);
  font-size: 22px; cursor: pointer; }
.chart { width: 100%; height: 180px; margin: 12px 0 6px; }
.chart .ln { fill: none; stroke: var(--accent); stroke-width: 2; }
.chart .ax { stroke: var(--line); }
.chart text { fill: var(--muted); font-size: 11px; }
.go { display: inline-block; margin-top: 8px; padding: 8px 14px; border-radius: 8px; background: var(--ink);
  color: var(--bg); text-decoration: none; font-size: 14px; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1><span class="pulse"></span>Live deals</h1>
      <span class="status" id="status">loading…</span>
    </div>
    <div class="controls">
      <div class="chips" id="stores"></div>
      <input type="search" id="q" placeholder="Search products… ابحث" aria-label="Search">
      <select id="min" aria-label="Minimum discount">
        <option value="5">5%+</option><option value="10" selected>10%+</option>
        <option value="20">20%+</option><option value="30">30%+</option><option value="50">50%+</option>
      </select>
      <select id="sort" aria-label="Sort">
        <option value="discount">Biggest %</option><option value="saving">Biggest saving</option>
        <option value="newest">Newest</option><option value="price">Cheapest</option>
      </select>
    </div>
  </div>
</header>
<main class="wrap">
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>No deals match yet. Collection may still be running.</div>
</main>
<dialog id="dlg">
  <button class="x" aria-label="Close" onclick="this.closest('dialog').close()">×</button>
  <h2 id="dname" dir="auto"></h2>
  <div class="note" id="dmeta"></div>
  <svg class="chart" id="chart" viewBox="0 0 520 180" preserveAspectRatio="none"></svg>
  <div class="note" id="dnote"></div>
  <a class="go" id="dgo" target="_blank" rel="noopener">Open in store ↗</a>
</dialog>
<script>
const $ = id => document.getElementById(id);
const state = { store: "", seen: new Set(), first: true, labels: {} };
const fmt = n => n == null ? "" : Number(n).toLocaleString("en-EG", { maximumFractionDigits: 2 });
const ago = t => { const s = Date.now() / 1000 - t; if (s < 90) return "just now";
  if (s < 3600) return Math.round(s / 60) + " min ago"; if (s < 86400) return Math.round(s / 3600) + " h ago";
  return Math.round(s / 86400) + " d ago"; };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function chips(status) {
  const stores = [["", "All"], ...status.map(s => [s.store, s.label])];
  $("stores").innerHTML = stores.map(([k, l]) =>
    `<button class="chip" aria-pressed="${state.store === k}" data-k="${k}">${esc(l)}</button>`).join("");
  $("stores").querySelectorAll(".chip").forEach(b => b.onclick = () => { state.store = b.dataset.k; load(); });
}

function card(d) {
  const label = state.labels[d.store] || d.store;
  const ref = d.store_discount_pct >= d.drop_pct ? d.original_price : d.usual_price;
  const why = d.store_discount_pct >= d.drop_pct ? "" : `usually ${fmt(d.usual_price)}`;
  const tags = [];
  if (d.flags.includes("lowest")) tags.push('<span class="tag lowest">lowest in 90 days</span>');
  if (d.flags.includes("new")) tags.push(`<span class="tag">dropped ${ago(d.since)}</span>`);
  if (d.flags.includes("steady")) tags.push('<span class="tag steady">same price for a while</span>');
  const fresh = !state.first && !state.seen.has(d.id) ? " fresh" : "";
  return `<article class="card${fresh}" data-id="${d.id}">
    <div class="pic">${d.image ? `<img loading="lazy" src="${esc(d.image)}" alt="" onerror="this.remove()">` : ""}
      <span class="badge">−${Math.round(d.discount_pct)}%</span>
      <span class="store" style="background:var(--${d.store}, #555)">${esc(label)}</span></div>
    <div class="body"><div class="name" dir="auto">${esc(d.name)}</div>
      <div class="tags">${tags.join("")}</div>
      <div class="prices"><span class="now">${fmt(d.price)} EGP</span>
        ${ref && !why ? `<span class="was">${fmt(ref)}</span>` : ""}</div>
      <div class="note">${why ? why + " · " : ""}save ${fmt(d.saving)} EGP</div></div></article>`;
}

let timer;
async function load() {
  const p = new URLSearchParams({ store: state.store, q: $("q").value.trim(), min: $("min").value, sort: $("sort").value, limit: 300 });
  try {
    const r = await fetch("/api/deals?" + p);
    const data = await r.json();
    state.labels = data.labels || {};
    chips(data.status || []);
    $("status").textContent = (data.status || []).map(s =>
      `${s.label}: ${s.products.toLocaleString()} products, updated ${ago(s.finished)}${s.error ? " (last run failed)" : ""}`).join(" · ")
      || "no collection has finished yet";
    $("grid").innerHTML = data.deals.map(card).join("");
    $("empty").hidden = data.deals.length > 0;
    data.deals.forEach(d => state.seen.add(d.id));
    state.first = false;
    $("grid").querySelectorAll(".card").forEach(c => c.onclick = () => showProduct(+c.dataset.id));
  } catch (e) { $("status").textContent = "can't reach the server, retrying…"; }
  clearTimeout(timer); timer = setTimeout(load, 60000);
}

async function showProduct(id) {
  const { product: p, history: h } = await (await fetch("/api/product/" + id)).json();
  $("dname").textContent = p.name;
  $("dmeta").textContent = `${state.labels[p.store] || p.store} · ${p.category} · tracked since ${new Date(p.first_seen * 1000).toLocaleDateString()}`;
  $("dgo").href = p.url;
  const now = Date.now() / 1000, pts = h.map(r => [r.at, r.price]).concat([[now, p.price]]);
  const t0 = pts[0][0], t1 = Math.max(now, t0 + 1);
  const ps = pts.map(x => x[1]), lo = Math.min(...ps), hi = Math.max(...ps), pad = (hi - lo) * .15 || hi * .05 || 1;
  const X = t => 40 + 470 * (t - t0) / (t1 - t0), Y = v => 160 - 140 * (v - (lo - pad)) / ((hi + pad) - (lo - pad));
  let d = "";
  pts.forEach(([t, v], i) => { d += i ? ` H${X(t).toFixed(1)} V${Y(v).toFixed(1)}` : `M${X(t).toFixed(1)} ${Y(v).toFixed(1)}`; });
  $("chart").innerHTML = `<line class="ax" x1="40" x2="510" y1="160" y2="160"/>
    <text x="0" y="${Y(hi) + 4}">${fmt(hi)}</text><text x="0" y="${Y(lo) + 4}">${fmt(lo)}</text>
    <path class="ln" d="${d}"/>`;
  $("dnote").textContent = h.length > 1 ? `${h.length} price changes recorded. Lowest ${fmt(lo)}, highest ${fmt(hi)} EGP.`
    : "Only one price seen so far; the chart fills in as prices change.";
  $("dlg").showModal();
}

let typing;
$("q").oninput = () => { clearTimeout(typing); typing = setTimeout(load, 300); };
$("min").onchange = $("sort").onchange = load;
load();
</script>
</body>
</html>
